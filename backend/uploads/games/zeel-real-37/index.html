<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Star Invaders</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05060C; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #05060C; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#05060C';
    const PLAYER_COLOR = '#00E5FF';
    const ENEMY_COLOR = '#FF3D57';
    const BULLET_COLOR = '#FFC93C';

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true, won = false;
    let playerX = 0, bullets = [], enemyBullets = [], enemies = [], score = 0, lives = 3, enemyDir = 1, enemySpeed = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      playerX = w / 2;
      draw();
    }

    function spawnWave() {
      enemies = [];
      const cols = 6, rows = 3;
      const spacing = w / (cols + 1);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({ x: spacing * (c + 1), y: 80 * dpr + r * 60 * dpr, alive: true });
        }
      }
      enemySpeed = 1 * dpr;
      enemyDir = 1;
    }

    function reset() {
      playerX = w / 2; bullets = []; enemyBullets = []; score = 0; lives = 3; ended = false; won = false;
      scoreEl.textContent = score;
      spawnWave();
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (name === 'LEFT') playerX -= 30 * dpr;
      if (name === 'RIGHT') playerX += 30 * dpr;
      if (name === 'JUMP' || name === 'BOOST') fireBullet();
    }

    function fireBullet() {
      if (bullets.length < 3) bullets.push({ x: playerX, y: h * 0.86 });
    }

    function pointerMove(x) { if (started && !ended) playerX = x; }
    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      pointerMove(x);
      fireBullet();
    }

    function step() {
      playerX = Math.max(24 * dpr, Math.min(w - 24 * dpr, playerX));

      bullets.forEach((b) => { b.y -= 8 * dpr; });
      bullets = bullets.filter((b) => b.y > -10 * dpr);

      let hitEdge = false;
      enemies.forEach((e) => {
        if (!e.alive) return;
        e.x += enemyDir * enemySpeed;
        if (e.x < 30 * dpr || e.x > w - 30 * dpr) hitEdge = true;
      });
      if (hitEdge) {
        enemyDir *= -1;
        enemies.forEach((e) => { e.y += 22 * dpr; });
        enemySpeed = Math.min(enemySpeed * 1.06, 5 * dpr);
      }

      if (Math.random() < 0.02) {
        const shooters = enemies.filter((e) => e.alive);
        if (shooters.length) {
          const s = shooters[Math.floor(Math.random() * shooters.length)];
          enemyBullets.push({ x: s.x, y: s.y + 12 * dpr });
        }
      }
      enemyBullets.forEach((b) => { b.y += 5 * dpr; });
      enemyBullets = enemyBullets.filter((b) => b.y < h + 10 * dpr);

      bullets.forEach((b) => {
        enemies.forEach((e) => {
          if (e.alive && Math.hypot(b.x - e.x, b.y - e.y) < 22 * dpr) {
            e.alive = false; b.y = -100 * dpr;
            score += 10; scoreEl.textContent = score;
          }
        });
      });

      enemyBullets.forEach((b) => {
        if (Math.abs(b.x - playerX) < 24 * dpr && Math.abs(b.y - h * 0.86) < 24 * dpr) {
          b.y = h + 100 * dpr;
          lives--;
          if (lives <= 0) { ended = true; won = false; }
        }
      });

      enemies.forEach((e) => {
        if (e.alive && e.y > h * 0.8) { ended = true; won = false; }
      });

      if (enemies.every((e) => !e.alive)) {
        score += 50; scoreEl.textContent = score;
        spawnWave();
      }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = PLAYER_COLOR;
      ctx.beginPath();
      ctx.moveTo(playerX, h * 0.86 - 18 * dpr);
      ctx.lineTo(playerX - 20 * dpr, h * 0.86 + 14 * dpr);
      ctx.lineTo(playerX + 20 * dpr, h * 0.86 + 14 * dpr);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = BULLET_COLOR;
      bullets.forEach((b) => { ctx.fillRect(b.x - 2 * dpr, b.y - 10 * dpr, 4 * dpr, 14 * dpr); });

      ctx.fillStyle = ENEMY_COLOR;
      enemyBullets.forEach((b) => { ctx.fillRect(b.x - 2 * dpr, b.y - 8 * dpr, 4 * dpr, 12 * dpr); });

      enemies.forEach((e) => {
        if (!e.alive) return;
        ctx.fillStyle = ENEMY_COLOR;
        ctx.beginPath();
        ctx.roundRect(e.x - 16 * dpr, e.y - 12 * dpr, 32 * dpr, 24 * dpr, 6 * dpr);
        ctx.fill();
      });

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 90 * dpr, h * 0.06, 180 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (13 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('LIVES: ' + Math.max(0, lives), w * 0.5, h * 0.06 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (22 * dpr) + 'px Arial';
        ctx.fillText('DRAG TO MOVE, TAP TO SHOOT', w / 2, h * 0.45);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = ENEMY_COLOR;
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to restart', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() {
      if (started && !ended) step();
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('pointermove', (e) => { if (e.buttons) pointerMove(e.clientX * dpr); });
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('touchmove', (e) => { const t = e.touches[0]; if (t) pointerMove(t.clientX * dpr); }, { passive: true });
    addEventListener('keydown', (e) => {
      if (!started) start();
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') { e.preventDefault(); playerX -= 20 * dpr; }
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') { e.preventDefault(); playerX += 20 * dpr; }
      if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); fireBullet(); }
    });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER') {
        if (data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
        else pointerMove(Number(data.x) * dpr);
      }
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
