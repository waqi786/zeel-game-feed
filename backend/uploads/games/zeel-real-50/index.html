<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Traffic Weave</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #202020; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #202020; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const ROAD_COLOR = '#2A2A2A';
    const LANE_LINE = 'rgba(255,255,255,.5)';
    const PLAYER_COLOR = '#00E5FF';
    const CAR_COLORS = ['#FF3D57', '#FFC93C', '#5B8DEF', '#00C48C', '#C77DFF'];

    let dpr = 1, w = 0, h = 0;
    const LANES = 4;
    let laneW = 0, roadLeft = 0;
    let started = false, ended = false, muted = true;
    let playerLane = 1, playerX = 0, cars = [], score = 0, elapsed = 0, spawnTimer = 0, laneOffset = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      laneW = Math.min(w * 0.8, 340 * dpr) / LANES;
      roadLeft = (w - laneW * LANES) / 2;
      playerX = roadLeft + laneW * (playerLane + 0.5);
      draw();
    }

    function reset() {
      cars = []; score = 0; elapsed = 0; spawnTimer = 0; ended = false; playerLane = 1;
      playerX = roadLeft + laneW * (playerLane + 0.5);
      scoreEl.textContent = score;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (name === 'LEFT') changeLane(-1);
      if (name === 'RIGHT') changeLane(1);
    }

    function changeLane(dir) {
      playerLane = Math.max(0, Math.min(LANES - 1, playerLane + dir));
    }

    let swipeStartX = null;
    function pointerDown(x, y) { if (ended) { reset(); return; } if (!started) { start(); return; } swipeStartX = x; }
    function pointerUp(x) {
      if (swipeStartX === null) return;
      const dx = x - swipeStartX;
      if (dx > 30 * dpr) changeLane(1);
      else if (dx < -30 * dpr) changeLane(-1);
      swipeStartX = null;
    }

    function spawnCar() {
      const lane = Math.floor(Math.random() * LANES);
      cars.push({ lane, y: -60 * dpr, speed: (4 + elapsed * 0.05) * dpr, color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)] });
    }

    function step(dt) {
      elapsed += dt;
      score = Math.floor(elapsed * 10);
      scoreEl.textContent = score;

      const targetX = roadLeft + laneW * (playerLane + 0.5);
      playerX += (targetX - playerX) * 0.25;

      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnTimer = Math.max(0.35, 0.9 - elapsed * 0.01); spawnCar(); }

      for (let i = cars.length - 1; i >= 0; i--) {
        const c = cars[i];
        c.y += c.speed;
        if (c.y > h + 60 * dpr) { cars.splice(i, 1); continue; }
        if (c.lane === playerLane && Math.abs(c.y - h * 0.8) < 46 * dpr) ended = true;
      }
    }

    function draw() {
      ctx.fillStyle = '#141414';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = ROAD_COLOR;
      ctx.fillRect(roadLeft, 0, laneW * LANES, h);

      ctx.strokeStyle = LANE_LINE;
      ctx.lineWidth = 3 * dpr;
      ctx.setLineDash([20 * dpr, 16 * dpr]);
      for (let i = 1; i < LANES; i++) {
        ctx.beginPath();
        ctx.moveTo(roadLeft + i * laneW, 0);
        ctx.lineTo(roadLeft + i * laneW, h);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      cars.forEach((c) => {
        const x = roadLeft + laneW * (c.lane + 0.5);
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.roundRect(x - laneW * 0.32, c.y - 30 * dpr, laneW * 0.64, 60 * dpr, 8 * dpr);
        ctx.fill();
      });

      ctx.fillStyle = PLAYER_COLOR;
      ctx.beginPath();
      ctx.roundRect(playerX - laneW * 0.32, h * 0.8 - 30 * dpr, laneW * 0.64, 60 * dpr, 8 * dpr);
      ctx.fill();

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 90 * dpr, h * 0.06, 180 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (14 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('SCORE: ' + score, w * 0.5, h * 0.06 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (20 * dpr) + 'px Arial';
        ctx.fillText('SWIPE TO WEAVE THROUGH TRAFFIC', w / 2, h * 0.45);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = CAR_COLORS[0];
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText('CRASHED!', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to restart', w / 2, h * 0.56);
      }
    }

    let raf = 0, lastT = 0;
    function loop(t) {
      const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
      lastT = t;
      if (started && !ended) step(dt);
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('pointerup', (e) => pointerUp(e.clientX * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('touchend', (e) => { const t = e.changedTouches[0]; if (t) pointerUp(t.clientX * dpr); }, { passive: true });
    addEventListener('keydown', (e) => {
      if (!started) start();
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') control('LEFT');
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') control('RIGHT');
    });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER') {
        if (data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
        if (data.kind === 'pointerup') pointerUp(Number(data.x) * dpr);
      }
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
