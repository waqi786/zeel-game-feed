<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Snake Classic</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0B1210; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #0B1210; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
    .hint { position: fixed; left: 50%; top: 82%; transform: translateX(-50%); z-index: 4; color: rgba(255,255,255,.8); font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; background: rgba(0,0,0,.5); padding: 8px 14px; border-radius: 999px; display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <div class="hint" id="hint">Swipe to steer</div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const hint = document.getElementById('hint');
    const scoreEl = document.getElementById('score');

    const BG = '#0B1210';
    const GRID_LINE = 'rgba(255,255,255,.05)';
    const SNAKE_COLOR = '#00E676';
    const HEAD_COLOR = '#FFFFFF';
    const FOOD_COLOR = '#FF3D57';

    let dpr = 1, w = 0, h = 0, cell = 20;
    let cols = 18, rows = 32;
    let running = false, started = false, muted = true, ended = false;
    let tickTimer = 0, tickInterval = 9;
    let snake, dir, nextDir, food, score;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || document.documentElement.clientWidth || 390;
      const rh = innerHeight || document.documentElement.clientHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      cols = 14;
      cell = Math.floor(w / cols);
      rows = Math.floor(h / cell);
      draw();
    }

    function reset() {
      const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
      snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      ended = false;
      scoreEl.textContent = score;
      placeFood();
    }

    function placeFood() {
      let fx, fy, collide;
      do {
        fx = Math.floor(Math.random() * cols);
        fy = Math.floor(Math.random() * rows);
        collide = snake.some((s) => s.x === fx && s.y === fy);
      } while (collide);
      food = { x: fx, y: fy };
    }

    function start() {
      if (running) return;
      hud.style.display = 'flex';
      hint.style.display = 'block';
      setTimeout(() => { hint.style.display = 'none'; }, 2200);
      running = true;
      started = true;
      raf = requestAnimationFrame(loop);
    }

    function setDirection(dx, dy) {
      if (dx === -dir.x && dy === -dir.y) return;
      nextDir = { x: dx, y: dy };
    }

    function control(name) {
      if (ended) { reset(); return; }
      if (!started) start();
      if (name === 'LEFT') { setDirection(-1, 0); }
      if (name === 'RIGHT') { setDirection(1, 0); }
      if (name === 'JUMP' || name === 'BOOST') {
        if (dir.y !== 0) setDirection(dir.x || 1, 0);
        else setDirection(0, dir.x >= 0 ? -1 : 1);
      }
    }

    let touchStartX = 0, touchStartY = 0, touchActive = false;
    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) start();
      touchStartX = x; touchStartY = y; touchActive = true;
    }
    function pointerMove(x, y) {
      if (!touchActive) return;
      const dx = x - touchStartX, dy = y - touchStartY;
      const absX = Math.abs(dx), absY = Math.abs(dy);
      if (Math.max(absX, absY) < 24) return;
      if (absX > absY) setDirection(dx > 0 ? 1 : -1, 0);
      else setDirection(0, dy > 0 ? 1 : -1);
      touchStartX = x; touchStartY = y;
    }
    function pointerUp() { touchActive = false; }

    function step() {
      dir = nextDir;
      const head = snake[0];
      const nx = (head.x + dir.x + cols) % cols;
      const ny = (head.y + dir.y + rows) % rows;
      if (snake.some((s, i) => i > 0 && s.x === nx && s.y === ny)) {
        ended = true;
        return;
      }
      snake.unshift({ x: nx, y: ny });
      if (nx === food.x && ny === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
        if (tickInterval > 4) tickInterval -= 0.15;
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = GRID_LINE;
      ctx.lineWidth = 1;
      for (let x = 0; x <= cols; x++) { ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, rows * cell); ctx.stroke(); }
      for (let y = 0; y <= rows; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell), ctx.lineTo(cols * cell, y * cell); ctx.stroke(); }

      ctx.shadowColor = FOOD_COLOR;
      ctx.shadowBlur = 16 * dpr;
      ctx.fillStyle = FOOD_COLOR;
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.38, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? HEAD_COLOR : SNAKE_COLOR;
        if (i === 0) { ctx.shadowColor = SNAKE_COLOR; ctx.shadowBlur = 18 * dpr; }
        ctx.beginPath();
        ctx.roundRect(seg.x * cell + 2, seg.y * cell + 2, cell - 4, cell - 4, 6 * dpr);
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 118 * dpr, h * 0.86, 236 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.font = '900 ' + (11 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('SWIPE TO STEER', w * 0.5, h * 0.86 + 20 * dpr);

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = SNAKE_COLOR;
        ctx.font = '900 ' + (34 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to restart', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() {
      tickTimer += 1;
      if (tickTimer >= tickInterval) {
        tickTimer = 0;
        if (!ended) step();
      }
      draw();
      raf = requestAnimationFrame(loop);
    }

    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('pointermove', (e) => pointerMove(e.clientX * dpr, e.clientY * dpr));
    addEventListener('pointerup', pointerUp);
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('touchmove', (e) => { const t = e.touches[0]; if (t) pointerMove(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('touchend', pointerUp, { passive: true });
    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') { e.preventDefault(); setDirection(-1, 0); if (!started) start(); }
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') { e.preventDefault(); setDirection(1, 0); if (!started) start(); }
      if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') { e.preventDefault(); setDirection(0, -1); if (!started) start(); }
      if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') { e.preventDefault(); setDirection(0, 1); if (!started) start(); }
      if (e.key === ' ') { e.preventDefault(); if (ended) reset(); }
    });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') start();
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER') {
        if (data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
        else pointerMove(Number(data.x) * dpr, Number(data.y) * dpr);
      }
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
  </script>
</body>
</html>
