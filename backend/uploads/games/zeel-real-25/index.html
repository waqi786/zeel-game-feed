<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Whack-a-Mole</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14210F; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #14210F; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#14210F';
    const HOLE_COLOR = '#1F2E17';
    const MOLE_COLOR = '#8B5A2B';
    const BOMB_COLOR = '#FF3D57';
    const COLS = 3, ROWS = 3;

    let dpr = 1, w = 0, h = 0, cellSize = 0, boardLeft = 0, boardTop = 0;
    let holes = [], score = 0, started = false, ended = false, muted = true, timeLeft = 30, spawnTimer = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      cellSize = Math.floor((w - 60 * dpr) / COLS);
      boardLeft = (w - cellSize * COLS) / 2;
      boardTop = h * 0.28;
      draw();
    }

    function reset() {
      holes = Array.from({ length: COLS * ROWS }, () => ({ up: false, isBomb: false, timer: 0 }));
      score = 0; ended = false; timeLeft = 30; spawnTimer = 0;
      scoreEl.textContent = score;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) { if (ended) { reset(); return; } if (!started) start(); }

    function cellAt(x, y) {
      const c = Math.floor((x - boardLeft) / cellSize);
      const r = Math.floor((y - boardTop) / cellSize);
      if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
      return r * COLS + c;
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      const idx = cellAt(x, y);
      if (idx < 0) return;
      const hole = holes[idx];
      if (!hole.up) return;
      if (hole.isBomb) { score = Math.max(0, score - 20); } else { score += 10; }
      scoreEl.textContent = score;
      hole.up = false; hole.timer = 0;
    }

    function step(dt) {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; ended = true; return; }
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTimer = 0.6 + Math.random() * 0.5;
        const idx = Math.floor(Math.random() * holes.length);
        if (!holes[idx].up) {
          holes[idx].up = true;
          holes[idx].isBomb = Math.random() < 0.22;
          holes[idx].timer = 0.75 + Math.random() * 0.4;
        }
      }
      holes.forEach((hole) => {
        if (hole.up) {
          hole.timer -= dt;
          if (hole.timer <= 0) hole.up = false;
        }
      });
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      holes.forEach((hole, i) => {
        const r = Math.floor(i / COLS), c = i % COLS;
        const x = boardLeft + c * cellSize + cellSize / 2, y = boardTop + r * cellSize + cellSize / 2;
        ctx.fillStyle = HOLE_COLOR;
        ctx.beginPath();
        ctx.ellipse(x, y, cellSize * 0.38, cellSize * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
        if (hole.up) {
          ctx.fillStyle = hole.isBomb ? BOMB_COLOR : MOLE_COLOR;
          ctx.beginPath();
          ctx.arc(x, y - cellSize * 0.12, cellSize * 0.28, 0, Math.PI * 2);
          ctx.fill();
          if (hole.isBomb) {
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '900 ' + Math.floor(cellSize * 0.24) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('X', x, y - cellSize * 0.06);
          }
        }
      });

      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 110 * dpr, h * 0.13, 220 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (13 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('TIME: ' + Math.ceil(timeLeft) + 's', w * 0.5, h * 0.13 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (24 * dpr) + 'px Arial';
        ctx.fillText('TAP MOLES, AVOID BOMBS', w / 2, h * 0.20);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = MOLE_COLOR;
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText("TIME'S UP!", w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to play again', w / 2, h * 0.56);
      }
    }

    let raf = 0, lastT = 0;
    function loop(t) {
      const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
      lastT = t;
      if (started && !ended) step(dt);
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
