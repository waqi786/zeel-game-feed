<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Connect Four</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0F1A2E; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #0F1A2E; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#0F1A2E';
    const BOARD_COLOR = '#16264A';
    const P1_COLOR = '#FFC93C';
    const P2_COLOR = '#FF3D57';
    const COLS = 7, ROWS = 6;

    let dpr = 1, w = 0, h = 0, cellSize = 0, boardLeft = 0, boardTop = 0;
    let grid = [], turn = 1, score = 0, started = false, ended = false, muted = true, message = '';

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      cellSize = Math.floor((w - 24 * dpr) / COLS);
      boardLeft = (w - cellSize * COLS) / 2;
      boardTop = h * 0.24;
      draw();
    }

    function reset() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      turn = 1; score = 0; ended = false; message = '';
      scoreEl.textContent = score;
    }

    function start() {
      hud.style.display = 'flex';
      started = true;
      raf = requestAnimationFrame(loop);
    }

    function control(name) {
      if (ended) { reset(); return; }
      if (!started) start();
    }

    function colAt(x) {
      const c = Math.floor((x - boardLeft) / cellSize);
      return c < 0 || c >= COLS ? -1 : c;
    }

    function dropDisc(col, player) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][col] === 0) { grid[r][col] = player; return { r, c: col }; }
      }
      return null;
    }

    function checkWinAt(r, c) {
      const player = grid[r][c];
      const dirs = [[0,1],[1,0],[1,1],[1,-1]];
      for (const [dr, dc] of dirs) {
        let count = 1;
        for (let s = 1; s < 4; s++) {
          const rr = r + dr * s, cc = c + dc * s;
          if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || grid[rr][cc] !== player) break;
          count++;
        }
        for (let s = 1; s < 4; s++) {
          const rr = r - dr * s, cc = c - dc * s;
          if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || grid[rr][cc] !== player) break;
          count++;
        }
        if (count >= 4) return true;
      }
      return false;
    }

    function boardFull() { return grid.every((row) => row.every((v) => v !== 0)); }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (turn !== 1) return;
      const col = colAt(x);
      if (col < 0) return;
      const pos = dropDisc(col, 1);
      if (!pos) return;
      if (checkWinAt(pos.r, pos.c)) { ended = true; message = 'YOU WIN!'; score = 100; scoreEl.textContent = score; return; }
      if (boardFull()) { ended = true; message = 'DRAW'; return; }
      turn = 2;
      setTimeout(aiMove, 450);
    }

    function aiMove() {
      if (ended) return;
      const validCols = [];
      for (let c = 0; c < COLS; c++) if (grid[0][c] === 0) validCols.push(c);
      if (!validCols.length) { ended = true; message = 'DRAW'; return; }
      let chosen = validCols[Math.floor(Math.random() * validCols.length)];
      for (const c of validCols) {
        const r = findDropRow(c);
        grid[r][c] = 2;
        if (checkWinAt(r, c)) { chosen = c; grid[r][c] = 0; break; }
        grid[r][c] = 0;
      }
      const pos = dropDisc(chosen, 2);
      if (pos && checkWinAt(pos.r, pos.c)) { ended = true; message = 'CPU WINS'; turn = 1; return; }
      if (boardFull()) { ended = true; message = 'DRAW'; return; }
      turn = 1;
    }

    function findDropRow(col) {
      for (let r = ROWS - 1; r >= 0; r--) if (grid[r][col] === 0) return r;
      return -1;
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = BOARD_COLOR;
      ctx.beginPath();
      ctx.roundRect(boardLeft - 8 * dpr, boardTop - 8 * dpr, cellSize * COLS + 16 * dpr, cellSize * ROWS + 16 * dpr, 12 * dpr);
      ctx.fill();

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = boardLeft + c * cellSize + cellSize / 2, y = boardTop + r * cellSize + cellSize / 2;
          const v = grid[r][c];
          ctx.fillStyle = v === 1 ? P1_COLOR : v === 2 ? P2_COLOR : 'rgba(255,255,255,.06)';
          ctx.beginPath();
          ctx.arc(x, y, cellSize * 0.38, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 130 * dpr, h * 0.12, 260 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = turn === 1 ? P1_COLOR : P2_COLOR;
      ctx.font = '900 ' + (12 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(turn === 1 ? 'YOUR TURN - TAP A COLUMN' : "CPU'S TURN", w * 0.5, h * 0.12 + 20 * dpr);

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = P1_COLOR;
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText(message || 'GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to play again', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() { draw(); raf = requestAnimationFrame(loop); }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
