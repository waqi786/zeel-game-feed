<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Balloon Pop</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0E1B2A; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #0E1B2A; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#0E1B2A';
    const BALLOON_COLORS = ['#FF3D57', '#FFC93C', '#00C48C', '#5B8DEF', '#B85CFF', '#FF7043'];

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true;
    let balloons = [], score = 0, missed = 0, maxMissed = 5, spawnTimer = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      draw();
    }

    function reset() {
      balloons = []; score = 0; missed = 0; ended = false; spawnTimer = 0;
      scoreEl.textContent = score;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) { if (ended) { reset(); return; } if (!started) start(); }

    function spawnBalloon() {
      const r = (20 + Math.random() * 16) * dpr;
      balloons.push({
        x: r + Math.random() * (w - 2 * r),
        y: h + r,
        r,
        speed: (1 + Math.random() * 1.8) * dpr,
        color: BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)],
        sway: Math.random() * Math.PI * 2,
        popped: false,
      });
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        if (!b.popped && Math.hypot(x - b.x, y - b.y) <= b.r) {
          b.popped = true;
          score += 10;
          scoreEl.textContent = score;
          return;
        }
      }
    }

    function step() {
      spawnTimer -= 1 / 60;
      if (spawnTimer <= 0) { spawnTimer = 0.5 + Math.random() * 0.5; spawnBalloon(); }
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        b.sway += 0.05;
        b.x += Math.sin(b.sway) * 0.6 * dpr;
        b.y -= b.speed;
        if (!b.popped && b.y < -b.r) {
          missed++;
          balloons.splice(i, 1);
          if (missed >= maxMissed) ended = true;
        } else if (b.popped && b.y < -b.r) {
          balloons.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      balloons.forEach((b) => {
        if (b.popped) return;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, b.r * 0.8, b.r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.4)';
        ctx.lineWidth = 2 * dpr;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + b.r);
        ctx.lineTo(b.x, b.y + b.r + 20 * dpr);
        ctx.stroke();
      });

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 110 * dpr, h * 0.06, 220 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (13 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('MISSED: ' + missed + '/' + maxMissed, w * 0.5, h * 0.06 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (24 * dpr) + 'px Arial';
        ctx.fillText('TAP BALLOONS BEFORE THEY ESCAPE', w / 2, h * 0.42);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = BALLOON_COLORS[0];
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to play again', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() {
      if (started && !ended) step();
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
