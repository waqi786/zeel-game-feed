<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Color Match</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #100E1C; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #100E1C; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#100E1C';
    const COLORS = [
      { name: 'RED', hex: '#FF3D57' },
      { name: 'BLUE', hex: '#5B8DEF' },
      { name: 'GREEN', hex: '#00C48C' },
      { name: 'YELLOW', hex: '#FFC93C' },
    ];

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true;
    let score = 0, lives = 3, timeLeft = 0, roundTime = 3.5, wordColor = 0, textColor = 0, match = false;
    let btnRects = [];

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      computeButtons();
      draw();
    }

    function computeButtons() {
      btnRects = [];
      const btnW = w * 0.42, btnH = h * 0.1, gap = 16 * dpr;
      const startY = h * 0.62;
      for (let i = 0; i < 4; i++) {
        const col = i % 2, row = Math.floor(i / 2);
        const x = w / 2 - btnW - gap / 2 + col * (btnW + gap);
        const y = startY + row * (btnH + gap);
        btnRects.push({ x, y, w: btnW, h: btnH });
      }
    }

    function reset() {
      score = 0; lives = 3; ended = false; roundTime = 3.5;
      scoreEl.textContent = score;
      newRound();
    }

    function newRound() {
      wordColor = Math.floor(Math.random() * COLORS.length);
      match = Math.random() < 0.5;
      if (match) textColor = wordColor;
      else { do { textColor = Math.floor(Math.random() * COLORS.length); } while (textColor === wordColor); }
      timeLeft = roundTime;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (name === 'JUMP') answer(true);
      if (name === 'BOOST') answer(false);
    }

    function answer(yes) {
      if (ended) return;
      const correct = (yes === match);
      if (correct) { score += 10; roundTime = Math.max(1.4, roundTime - 0.05); }
      else { lives--; }
      scoreEl.textContent = score;
      if (lives <= 0) { ended = true; return; }
      newRound();
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      for (let i = 0; i < btnRects.length; i++) {
        const b = btnRects[i];
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
          answer(i === 0);
          return;
        }
      }
    }

    function step(dt) {
      timeLeft -= dt;
      if (timeLeft <= 0) { lives--; scoreEl.textContent = score; if (lives <= 0) { ended = true; return; } newRound(); }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = COLORS[textColor].hex;
      ctx.font = '900 ' + (48 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(COLORS[wordColor].name, w / 2, h * 0.36);

      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.font = '800 ' + (13 * dpr) + 'px Arial';
      ctx.fillText('DOES TEXT COLOR MATCH THE WORD?', w / 2, h * 0.44);

      const btnLabels = ['YES', 'NO', 'YES', 'NO'];
      btnRects.forEach((b, i) => {
        ctx.fillStyle = i % 2 === 0 ? '#00C48C' : '#FF3D57';
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 12 * dpr);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (16 * dpr) + 'px Arial';
        ctx.fillText(btnLabels[i], b.x + b.w / 2, b.y + b.h / 2 + 6 * dpr);
      });

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 130 * dpr, h * 0.14, 260 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (12 * dpr) + 'px Arial';
      ctx.fillText('LIVES: ' + lives + '   TIME: ' + timeLeft.toFixed(1), w * 0.5, h * 0.14 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (22 * dpr) + 'px Arial';
        ctx.fillText('TAP YES/NO TO MATCH COLOR', w / 2, h * 0.20);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#FF3D57';
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to play again', w / 2, h * 0.56);
      }
    }

    let raf = 0, lastT = 0;
    function loop(t) {
      const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
      lastT = t;
      if (started && !ended) step(dt);
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
