<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fruit Slice</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10151C; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #10151C; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#10151C';
    const FRUIT_COLORS = ['#FF3D57', '#FFC93C', '#00C48C', '#5B8DEF', '#B85CFF'];
    const BOMB_COLOR = '#22252B';

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true;
    let fruits = [], score = 0, lives = 3, spawnTimer = 0, trail = [];

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      draw();
    }

    function reset() {
      fruits = []; score = 0; lives = 3; ended = false; spawnTimer = 0; trail = [];
      scoreEl.textContent = score;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) { if (ended) { reset(); return; } if (!started) start(); }

    function spawnFruit() {
      const isBomb = Math.random() < 0.15;
      const x = w * 0.15 + Math.random() * w * 0.7;
      fruits.push({
        x, y: h + 30 * dpr,
        vx: (Math.random() - 0.5) * 3 * dpr,
        vy: -(14 + Math.random() * 4) * dpr,
        r: 24 * dpr,
        color: isBomb ? BOMB_COLOR : FRUIT_COLORS[Math.floor(Math.random() * FRUIT_COLORS.length)],
        isBomb, sliced: false,
      });
    }

    function pointerMove(x, y) {
      if (!started || ended) return;
      trail.push({ x, y, t: 12 });
      if (trail.length > 20) trail.shift();
      fruits.forEach((f) => {
        if (f.sliced) return;
        if (Math.hypot(x - f.x, y - f.y) < f.r) {
          f.sliced = true;
          if (f.isBomb) { lives--; if (lives <= 0) ended = true; }
          else { score += 10; scoreEl.textContent = score; }
        }
      });
    }
    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      pointerMove(x, y);
    }

    function step() {
      spawnTimer -= 1 / 60;
      if (spawnTimer <= 0) { spawnTimer = 0.7 + Math.random() * 0.5; spawnFruit(); }
      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.vy += 0.35 * dpr;
        f.x += f.vx; f.y += f.vy;
        if (f.y > h + 60 * dpr) {
          if (!f.sliced && !f.isBomb) { lives--; if (lives <= 0) ended = true; }
          fruits.splice(i, 1);
        } else if (f.sliced && f.y > h + 60 * dpr) {
          fruits.splice(i, 1);
        }
      }
      trail.forEach((t) => t.t -= 1);
      trail = trail.filter((t) => t.t > 0);
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      if (trail.length > 1) {
        ctx.strokeStyle = 'rgba(255,255,255,.5)';
        ctx.lineWidth = 4 * dpr;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(trail[0].x, trail[0].y);
        for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }

      fruits.forEach((f) => {
        if (f.sliced) return;
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
        if (f.isBomb) {
          ctx.fillStyle = '#FF3D57';
          ctx.beginPath();
          ctx.arc(f.x, f.y - f.r * 0.9, f.r * 0.15, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 100 * dpr, h * 0.06, 200 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (14 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('LIVES: ' + Math.max(0, lives), w * 0.5, h * 0.06 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (22 * dpr) + 'px Arial';
        ctx.fillText('SWIPE TO SLICE, AVOID BOMBS', w / 2, h * 0.42);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = FRUIT_COLORS[0];
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to play again', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() {
      if (started && !ended) step();
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('pointermove', (e) => pointerMove(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('touchmove', (e) => { const t = e.touches[0]; if (t) pointerMove(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
