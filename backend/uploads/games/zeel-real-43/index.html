<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pinball Blitz</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0A0A14; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #0A0A14; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#0A0A14';
    const BALL_COLOR = '#FFC93C';
    const BUMPER_COLOR = '#5B8DEF';
    const BUMPER_HIT_COLOR = '#FF3D57';
    const FLIPPER_COLOR = '#00E5FF';
    const WALL_COLOR = 'rgba(255,255,255,.14)';

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true;
    let ballX = 0, ballY = 0, vx = 0, vy = 0, score = 0, balls = 3, bumpers = [], flipperL = 0, flipperR = 0, gravity = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      gravity = 0.28 * dpr;
      setupBumpers();
      launchBall();
      draw();
    }

    function setupBumpers() {
      bumpers = [
        { x: w * 0.3, y: h * 0.32, r: 22 * dpr, hit: 0 },
        { x: w * 0.7, y: h * 0.32, r: 22 * dpr, hit: 0 },
        { x: w * 0.5, y: h * 0.44, r: 26 * dpr, hit: 0 }
      ];
    }

    function launchBall() {
      ballX = w * 0.88; ballY = h * 0.7; vx = -1 * dpr; vy = -14 * dpr;
    }

    function reset() {
      score = 0; balls = 3; ended = false;
      scoreEl.textContent = score;
      setupBumpers();
      launchBall();
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (name === 'LEFT') flipperL = 1;
      if (name === 'RIGHT') flipperR = 1;
      if (name === 'JUMP') launchBall();
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (x < w / 2) flipperL = 1; else flipperR = 1;
    }
    function pointerUp() { flipperL = 0; flipperR = 0; }

    function step() {
      vy += gravity;
      ballX += vx; ballY += vy;

      if (ballX < 18 * dpr) { ballX = 18 * dpr; vx *= -0.8; }
      if (ballX > w - 18 * dpr) { ballX = w - 18 * dpr; vx *= -0.8; }
      if (ballY < 18 * dpr) { ballY = 18 * dpr; vy *= -0.8; }

      bumpers.forEach((b) => {
        const dx = ballX - b.x, dy = ballY - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < b.r + 12 * dpr) {
          const angle = Math.atan2(dy, dx);
          vx = Math.cos(angle) * 8 * dpr;
          vy = Math.sin(angle) * 8 * dpr;
          b.hit = 10;
          score += 25;
          scoreEl.textContent = score;
        }
        if (b.hit > 0) b.hit--;
      });

      const flipperY = h * 0.86;
      if (Math.abs(ballY - flipperY) < 20 * dpr) {
        if (ballX < w * 0.5 && flipperL) { vy = -13 * dpr; vx += 2 * dpr; }
        if (ballX >= w * 0.5 && flipperR) { vy = -13 * dpr; vx -= 2 * dpr; }
      }

      if (ballY > h + 30 * dpr) {
        balls--;
        if (balls <= 0) { ended = true; }
        else launchBall();
      }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = WALL_COLOR;
      ctx.lineWidth = 4 * dpr;
      ctx.strokeRect(6 * dpr, 6 * dpr, w - 12 * dpr, h - 12 * dpr);

      bumpers.forEach((b) => {
        ctx.fillStyle = b.hit > 0 ? BUMPER_HIT_COLOR : BUMPER_COLOR;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = FLIPPER_COLOR;
      ctx.save();
      ctx.translate(w * 0.28, h * 0.86);
      ctx.rotate(flipperL ? -0.4 : 0.15);
      ctx.fillRect(-40 * dpr, -6 * dpr, 80 * dpr, 12 * dpr);
      ctx.restore();

      ctx.save();
      ctx.translate(w * 0.72, h * 0.86);
      ctx.rotate(flipperR ? 0.4 : -0.15);
      ctx.fillRect(-40 * dpr, -6 * dpr, 80 * dpr, 12 * dpr);
      ctx.restore();

      ctx.fillStyle = BALL_COLOR;
      ctx.beginPath();
      ctx.arc(ballX, ballY, 10 * dpr, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 90 * dpr, h * 0.04, 180 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (13 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('BALLS: ' + Math.max(0, balls), w * 0.5, h * 0.04 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (20 * dpr) + 'px Arial';
        ctx.fillText('TAP LEFT/RIGHT SIDE TO FLIP', w / 2, h * 0.55);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = BUMPER_HIT_COLOR;
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to restart', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() {
      if (started && !ended) step();
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('pointerup', pointerUp);
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('touchend', pointerUp, { passive: true });
    addEventListener('keydown', (e) => {
      if (!started) start();
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') flipperL = 1;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') flipperR = 1;
    });
    addEventListener('keyup', () => { flipperL = 0; flipperR = 0; });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER') {
        if (data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
        if (data.kind === 'pointerup') pointerUp();
      }
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
