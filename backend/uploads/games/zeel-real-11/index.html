<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pixel Pong</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0C0F14; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #0C0F14; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#0C0F14';
    const PLAYER_COLOR = '#5B8DEF';
    const CPU_COLOR = '#FF3D57';
    const BALL_COLOR = '#FFFFFF';

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true;
    let playerX = 0, cpuX = 0, ballX = 0, ballY = 0, ballVX = 0, ballVY = 0;
    let score = 0, lives = 3;
    const PADDLE_W = 90, PADDLE_H = 16;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      playerX = w / 2; cpuX = w / 2;
      draw();
    }

    function reset() {
      score = 0; lives = 3; ended = false;
      scoreEl.textContent = score;
      serveBall();
    }

    function serveBall() {
      ballX = w / 2; ballY = h / 2;
      const angle = (Math.random() * 0.6 - 0.3) + (Math.random() < 0.5 ? 0 : Math.PI);
      ballVX = Math.sin(angle) * 6 * dpr;
      ballVY = Math.cos(angle) * 6 * dpr + (Math.random() < 0.5 ? 1 : -1) * 0.001;
      if (Math.abs(ballVY) < 3 * dpr) ballVY = 5 * dpr * (Math.random() < 0.5 ? 1 : -1);
    }

    function start() {
      hud.style.display = 'flex';
      started = true;
      raf = requestAnimationFrame(loop);
    }

    function control(name) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (name === 'LEFT') playerX -= 44 * dpr;
      if (name === 'RIGHT') playerX += 44 * dpr;
    }

    function pointerDown(x) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      playerX = x;
    }
    function pointerMove(x) {
      if (started && !ended) playerX = x;
    }

    function step() {
      playerX = Math.max(PADDLE_W / 2 * dpr, Math.min(w - PADDLE_W / 2 * dpr, playerX));
      const cpuTarget = ballX;
      cpuX += (cpuTarget - cpuX) * 0.09;
      cpuX = Math.max(PADDLE_W / 2 * dpr, Math.min(w - PADDLE_W / 2 * dpr, cpuX));

      ballX += ballVX;
      ballY += ballVY;

      if (ballX < 10 * dpr) { ballX = 10 * dpr; ballVX *= -1; }
      if (ballX > w - 10 * dpr) { ballX = w - 10 * dpr; ballVX *= -1; }

      const playerY = h - 120 * dpr, cpuY = 90 * dpr;
      const pw = PADDLE_W * dpr, ph = PADDLE_H * dpr;

      if (ballVY > 0 && ballY > playerY - ph / 2 && ballY < playerY + ph / 2 + 20 * dpr) {
        if (Math.abs(ballX - playerX) < pw / 2 + 10 * dpr) {
          ballVY *= -1.04;
          ballVX += (ballX - playerX) * 0.05;
          score += 1;
          scoreEl.textContent = score;
        }
      }
      if (ballVY < 0 && ballY < cpuY + ph / 2 && ballY > cpuY - ph / 2 - 20 * dpr) {
        if (Math.abs(ballX - cpuX) < pw / 2 + 10 * dpr) {
          ballVY *= -1.04;
          ballVX += (ballX - cpuX) * 0.05;
        }
      }

      if (ballY > h + 40 * dpr) { lives -= 1; if (lives <= 0) ended = true; else serveBall(); }
      if (ballY < -40 * dpr) { score += 3; scoreEl.textContent = score; serveBall(); }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(255,255,255,.12)';
      ctx.setLineDash([10 * dpr, 10 * dpr]);
      ctx.beginPath();
      ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = PLAYER_COLOR;
      ctx.beginPath();
      ctx.roundRect(playerX - PADDLE_W / 2 * dpr, h - 120 * dpr, PADDLE_W * dpr, PADDLE_H * dpr, 6 * dpr);
      ctx.fill();

      ctx.fillStyle = CPU_COLOR;
      ctx.beginPath();
      ctx.roundRect(cpuX - PADDLE_W / 2 * dpr, 90 * dpr, PADDLE_W * dpr, PADDLE_H * dpr, 6 * dpr);
      ctx.fill();

      ctx.fillStyle = BALL_COLOR;
      ctx.beginPath();
      ctx.arc(ballX, ballY, 10 * dpr, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < lives; i++) {
        ctx.fillStyle = PLAYER_COLOR;
        ctx.beginPath();
        ctx.arc(w - 30 * dpr - i * 26 * dpr, 150 * dpr, 8 * dpr, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 120 * dpr, h * 0.85, 240 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.font = '900 ' + (11 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('DRAG TO MOVE PADDLE', w * 0.5, h * 0.85 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (26 * dpr) + 'px Arial';
        ctx.fillText('TAP TO START', w / 2, h * 0.30);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = CPU_COLOR;
        ctx.font = '900 ' + (32 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to restart', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() {
      if (started && !ended) step();
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr));
    addEventListener('pointermove', (e) => { if (e.buttons) pointerMove(e.clientX * dpr); });
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr); }, { passive: true });
    addEventListener('touchmove', (e) => { const t = e.touches[0]; if (t) pointerMove(t.clientX * dpr); }, { passive: true });
    addEventListener('keydown', (e) => {
      if (!started) start();
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') { e.preventDefault(); playerX -= 30 * dpr; }
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') { e.preventDefault(); playerX += 30 * dpr; }
    });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER') {
        if (data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr);
        else pointerMove(Number(data.x) * dpr);
      }
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
