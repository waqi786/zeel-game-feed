<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Math Blitz</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0F1216; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #0F1216; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#0F1216';
    const CORRECT_COLOR = '#00C48C';
    const WRONG_COLOR = '#FF3D57';
    const OPT_COLOR = '#5B8DEF';

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true;
    let score = 0, lives = 3, timeLeft = 0, roundTime = 6, question = '', answer = 0, options = [], btnRects = [], flashColor = null, flashTimer = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      computeButtons();
      draw();
    }

    function computeButtons() {
      btnRects = [];
      const btnW = w * 0.42, btnH = h * 0.1, gap = 16 * dpr;
      const startY = h * 0.55;
      for (let i = 0; i < 4; i++) {
        const col = i % 2, row = Math.floor(i / 2);
        const x = w / 2 - btnW - gap / 2 + col * (btnW + gap);
        const y = startY + row * (btnH + gap);
        btnRects.push({ x, y, w: btnW, h: btnH });
      }
    }

    function reset() {
      score = 0; lives = 3; ended = false; roundTime = 6;
      scoreEl.textContent = score;
      newQuestion();
    }

    function newQuestion() {
      const ops = ['+', '-', 'x'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      let a = Math.floor(Math.random() * 12) + 1, b = Math.floor(Math.random() * 12) + 1;
      if (op === '-' && b > a) [a, b] = [b, a];
      if (op === '+') answer = a + b;
      else if (op === '-') answer = a - b;
      else answer = a * b;
      question = a + ' ' + op + ' ' + b;
      const opts = new Set([answer]);
      while (opts.size < 4) {
        const delta = Math.floor(Math.random() * 10) - 5;
        const val = answer + delta;
        if (delta !== 0 && val >= 0) opts.add(val);
      }
      options = [...opts];
      for (let i = options.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [options[i], options[j]] = [options[j], options[i]]; }
      timeLeft = roundTime;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) { if (ended) { reset(); return; } if (!started) start(); }

    function submit(val) {
      if (ended) return;
      if (val === answer) { score += 10; roundTime = Math.max(3, roundTime - 0.1); flashColor = CORRECT_COLOR; }
      else { lives--; flashColor = WRONG_COLOR; }
      flashTimer = 0.25;
      scoreEl.textContent = score;
      if (lives <= 0) { ended = true; return; }
      newQuestion();
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      for (let i = 0; i < btnRects.length; i++) {
        const b = btnRects[i];
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { submit(options[i]); return; }
      }
    }

    function step(dt) {
      timeLeft -= dt;
      if (flashTimer > 0) flashTimer -= dt;
      if (timeLeft <= 0) {
        lives--;
        scoreEl.textContent = score;
        if (lives <= 0) { ended = true; return; }
        newQuestion();
      }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (44 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(question, w / 2, h * 0.32);

      options.forEach((opt, i) => {
        const b = btnRects[i];
        ctx.fillStyle = flashTimer > 0 && opt === answer ? flashColor : OPT_COLOR;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 12 * dpr);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (18 * dpr) + 'px Arial';
        ctx.fillText(String(opt), b.x + b.w / 2, b.y + b.h / 2 + 6 * dpr);
      });

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 130 * dpr, h * 0.10, 260 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (12 * dpr) + 'px Arial';
      ctx.fillText('LIVES: ' + lives + '   TIME: ' + Math.max(0, timeLeft).toFixed(1), w * 0.5, h * 0.10 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (22 * dpr) + 'px Arial';
        ctx.fillText('SOLVE THE MATH FAST!', w / 2, h * 0.16);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = WRONG_COLOR;
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to play again', w / 2, h * 0.56);
      }
    }

    let raf = 0, lastT = 0;
    function loop(t) {
      const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
      lastT = t;
      if (started && !ended) step(dt);
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
