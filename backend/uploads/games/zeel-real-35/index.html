<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dodge Blocks</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0A0F1A; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #0A0F1A; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#0A0F1A';
    const PLAYER_COLOR = '#00E5FF';
    const BLOCK_COLOR = '#FF3D57';

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true;
    let playerX = 0, playerR = 20, blocks = [], score = 0, spawnTimer = 0, elapsed = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      playerR = 20 * dpr;
      playerX = w / 2;
      draw();
    }

    function reset() {
      blocks = []; score = 0; ended = false; spawnTimer = 0; elapsed = 0;
      playerX = w / 2;
      scoreEl.textContent = score;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (name === 'LEFT') playerX -= 40 * dpr;
      if (name === 'RIGHT') playerX += 40 * dpr;
    }

    function pointerMove(x) { if (started && !ended) playerX = x; }
    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      pointerMove(x);
    }

    function spawnBlock() {
      const bw = (30 + Math.random() * 50) * dpr;
      blocks.push({ x: Math.random() * (w - bw), y: -30 * dpr, w: bw, h: 26 * dpr, speed: (3 + elapsed * 0.05) * dpr });
    }

    function step(dt) {
      elapsed += dt;
      score = Math.floor(elapsed * 10);
      scoreEl.textContent = score;
      playerX = Math.max(playerR, Math.min(w - playerR, playerX));

      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnTimer = Math.max(0.35, 0.9 - elapsed * 0.01); spawnBlock(); }

      for (let i = blocks.length - 1; i >= 0; i--) {
        const b = blocks[i];
        b.y += b.speed;
        if (b.y > h) { blocks.splice(i, 1); continue; }
        const closestX = Math.max(b.x, Math.min(playerX, b.x + b.w));
        const closestY = Math.max(b.y, Math.min(h * 0.82, b.y + b.h));
        if (Math.hypot(playerX - closestX, h * 0.82 - closestY) < playerR) { ended = true; }
      }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      blocks.forEach((b) => {
        ctx.fillStyle = BLOCK_COLOR;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4 * dpr);
        ctx.fill();
      });

      ctx.fillStyle = PLAYER_COLOR;
      ctx.beginPath();
      ctx.arc(playerX, h * 0.82, playerR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 90 * dpr, h * 0.06, 180 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (14 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('SCORE: ' + score, w * 0.5, h * 0.06 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (24 * dpr) + 'px Arial';
        ctx.fillText('DRAG TO DODGE BLOCKS', w / 2, h * 0.42);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = BLOCK_COLOR;
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to restart', w / 2, h * 0.56);
      }
    }

    let raf = 0, lastT = 0;
    function loop(t) {
      const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
      lastT = t;
      if (started && !ended) step(dt);
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('pointermove', (e) => { if (e.buttons) pointerMove(e.clientX * dpr); });
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('touchmove', (e) => { const t = e.touches[0]; if (t) pointerMove(t.clientX * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER') {
        if (data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
        else pointerMove(Number(data.x) * dpr);
      }
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
