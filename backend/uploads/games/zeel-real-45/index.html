<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Darts Master</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14100C; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #14100C; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#14100C';
    const RING_COLORS = ['#2E7D32', '#C62828', '#F9A825', '#1565C0', '#EEEEEE'];
    const DART_COLOR = '#FFC93C';

    let dpr = 1, w = 0, h = 0, cx = 0, cy = 0, boardR = 0;
    let started = false, ended = false, muted = true;
    let throws = 0, maxThrows = 5, score = 0, aimX = 0, aimY = 0, wobble = 0, darts = [];

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      cx = w / 2; cy = h * 0.42;
      boardR = Math.min(w, h) * 0.32;
      aimX = cx; aimY = cy;
      draw();
    }

    function reset() {
      throws = 0; score = 0; ended = false; darts = [];
      scoreEl.textContent = score;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) { if (ended) { reset(); return; } if (!started) start(); }

    function scoreAt(x, y) {
      const dist = Math.hypot(x - cx, y - cy);
      const ratio = dist / boardR;
      if (ratio > 1.05) return 0;
      if (ratio < 0.06) return 50;
      if (ratio < 0.14) return 25;
      if (ratio < 0.4) return 15;
      if (ratio < 0.7) return 10;
      if (ratio < 0.9) return 5;
      return 1;
    }

    function throwDart(x, y) {
      if (ended || throws >= maxThrows) return;
      const jitterAmt = 30 * dpr * (1 - Math.min(0.7, throws * 0.02));
      const jx = x + (Math.random() - 0.5) * jitterAmt;
      const jy = y + (Math.random() - 0.5) * jitterAmt;
      const pts = scoreAt(jx, jy);
      darts.push({ x: jx, y: jy });
      score += pts;
      throws++;
      scoreEl.textContent = score;
      if (throws >= maxThrows) ended = true;
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      throwDart(x, y);
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      const rings = [1, 0.9, 0.7, 0.4, 0.14, 0.06];
      for (let i = 0; i < rings.length - 1; i++) {
        ctx.fillStyle = RING_COLORS[i % RING_COLORS.length];
        ctx.beginPath();
        ctx.arc(cx, cy, boardR * rings[i], 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#FFC93C';
      ctx.beginPath();
      ctx.arc(cx, cy, boardR * rings[rings.length - 1], 0, Math.PI * 2);
      ctx.fill();

      darts.forEach((d) => {
        ctx.fillStyle = DART_COLOR;
        ctx.beginPath();
        ctx.arc(d.x, d.y, 6 * dpr, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5 * dpr;
        ctx.stroke();
      });

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 100 * dpr, h * 0.08, 200 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (13 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('THROWS LEFT: ' + Math.max(0, maxThrows - throws), w * 0.5, h * 0.08 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (22 * dpr) + 'px Arial';
        ctx.fillText('TAP THE BOARD TO THROW', w / 2, h * 0.86);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = DART_COLOR;
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText('ROUND OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to throw again', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() { draw(); raf = requestAnimationFrame(loop); }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
