<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Checker Kings</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1B1B1B; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #1B1B1B; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#1B1B1B';
    const LIGHT = '#EED9B4';
    const DARK = '#7C4A2D';
    const P1 = '#FF3D57';
    const P2 = '#5B8DEF';
    const KING_MARK = '#FFC93C';

    let dpr = 1, w = 0, h = 0, cell = 0, boardLeft = 0, boardTop = 0;
    let board = [], turn = 1, selected = -1, score = 0, started = false, ended = false, muted = true, won = false;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      cell = Math.floor(Math.min(w - 30 * dpr, h * 0.6) / 8);
      boardLeft = (w - cell * 8) / 2;
      boardTop = h * 0.18;
      draw();
    }

    function setupBoard() {
      board = Array(64).fill(0);
      for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) board[r * 8 + c] = 2;
      for (let r = 5; r < 8; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) board[r * 8 + c] = 1;
    }

    function reset() {
      setupBoard(); turn = 1; selected = -1; score = 0; ended = false; won = false;
      scoreEl.textContent = score;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) { if (ended) { reset(); return; } if (!started) start(); }

    function idxAt(x, y) {
      const c = Math.floor((x - boardLeft) / cell), r = Math.floor((y - boardTop) / cell);
      if (c < 0 || c >= 8 || r < 0 || r >= 8) return -1;
      return r * 8 + c;
    }

    function isPlayer(piece) { return piece === 1 || piece === 3; }
    function isAI(piece) { return piece === 2 || piece === 4; }
    function isKing(piece) { return piece === 3 || piece === 4; }

    function validMovesFor(idx) {
      const piece = board[idx];
      const r = Math.floor(idx / 8), c = idx % 8;
      const dirs = [];
      if (piece === 1 || piece === 3) dirs.push([-1, -1], [-1, 1]);
      if (piece === 2 || piece === 4) dirs.push([1, -1], [1, 1]);
      if (isKing(piece)) dirs.push(...(piece === 1 || piece === 3 ? [[1,-1],[1,1]] : [[-1,-1],[-1,1]]));
      const moves = [];
      dirs.forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && board[nr * 8 + nc] === 0) moves.push({ to: nr * 8 + nc, capture: -1 });
        const jr = r + dr * 2, jc = c + dc * 2;
        if (jr >= 0 && jr < 8 && jc >= 0 && jc < 8 && board[jr * 8 + jc] === 0) {
          const midPiece = board[nr * 8 + nc];
          if (midPiece && ((isPlayer(piece) && isAI(midPiece)) || (isAI(piece) && isPlayer(midPiece)))) {
            moves.push({ to: jr * 8 + jc, capture: nr * 8 + nc });
          }
        }
      });
      return moves;
    }

    function applyMove(idx, move) {
      const piece = board[idx];
      board[idx] = 0;
      board[move.to] = piece;
      if (move.capture >= 0) { board[move.capture] = 0; score += 10; scoreEl.textContent = score; }
      const r = Math.floor(move.to / 8);
      if (piece === 1 && r === 0) board[move.to] = 3;
      if (piece === 2 && r === 7) board[move.to] = 4;
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (turn !== 1) return;
      const idx = idxAt(x, y);
      if (idx < 0) return;
      if (selected >= 0) {
        const moves = validMovesFor(selected);
        const move = moves.find((m) => m.to === idx);
        if (move) {
          applyMove(selected, move);
          selected = -1;
          turn = 2;
          checkEnd();
          setTimeout(aiMove, 400);
          return;
        }
        selected = -1;
      }
      if (isPlayer(board[idx])) selected = idx;
    }

    function aiMove() {
      if (ended || turn !== 2) return;
      const aiPieces = board.map((p, i) => ({ p, i })).filter((x) => isAI(x.p));
      let best = null;
      aiPieces.forEach(({ i }) => {
        const moves = validMovesFor(i);
        moves.forEach((m) => {
          if (!best || (m.capture >= 0 && best.move.capture < 0)) best = { from: i, move: m };
        });
      });
      if (best) applyMove(best.from, best.move);
      turn = 1;
      checkEnd();
    }

    function checkEnd() {
      const playerCount = board.filter((p) => isPlayer(p)).length;
      const aiCount = board.filter((p) => isAI(p)).length;
      if (playerCount === 0) { ended = true; won = false; }
      if (aiCount === 0) { ended = true; won = true; score += 50; scoreEl.textContent = score; }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const x = boardLeft + c * cell, y = boardTop + r * cell;
          ctx.fillStyle = (r + c) % 2 === 0 ? LIGHT : DARK;
          ctx.fillRect(x, y, cell, cell);
          const idx = r * 8 + c;
          if (selected === idx) {
            ctx.fillStyle = 'rgba(255,255,255,.3)';
            ctx.fillRect(x, y, cell, cell);
          }
        }
      }

      board.forEach((piece, idx) => {
        if (!piece) return;
        const r = Math.floor(idx / 8), c = idx % 8;
        const x = boardLeft + c * cell + cell / 2, y = boardTop + r * cell + cell / 2;
        ctx.fillStyle = isPlayer(piece) ? P1 : P2;
        ctx.beginPath();
        ctx.arc(x, y, cell * 0.36, 0, Math.PI * 2);
        ctx.fill();
        if (isKing(piece)) {
          ctx.fillStyle = KING_MARK;
          ctx.font = '900 ' + Math.floor(cell * 0.3) + 'px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('K', x, y + 1 * dpr);
        }
      });
      ctx.textBaseline = 'alphabetic';

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 100 * dpr, h * 0.06, 200 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (13 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(turn === 1 ? 'YOUR TURN' : 'AI THINKING...', w * 0.5, h * 0.06 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (20 * dpr) + 'px Arial';
        ctx.fillText('TAP TO SELECT, TAP TO MOVE', w / 2, h * 0.9);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = won ? P1 : P2;
        ctx.font = '900 ' + (28 * dpr) + 'px Arial';
        ctx.fillText(won ? 'YOU WIN!' : 'AI WINS', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to play again', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() { draw(); raf = requestAnimationFrame(loop); }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
