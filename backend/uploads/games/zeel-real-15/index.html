<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mine Sweep</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171B1F; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #171B1F; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#171B1F';
    const CLOSED_COLOR = '#2E3742';
    const OPEN_COLOR = '#0F1418';
    const MINE_COLOR = '#FF3D57';
    const FLAG_COLOR = '#FFC93C';
    const NUM_COLORS = ['#5B8DEF', '#00C48C', '#FF7043', '#B85CFF', '#FFC93C', '#00E5FF', '#FFFFFF', '#EDE0C8'];
    const COLS = 8, ROWS = 10, MINES = 12;

    let dpr = 1, w = 0, h = 0, cellSize = 0, boardLeft = 0, boardTop = 0;
    let grid = [], score = 0, started = false, ended = false, won = false, muted = true, flagMode = false, firstClick = true;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      cellSize = Math.floor((w - 24 * dpr) / COLS);
      boardLeft = (w - cellSize * COLS) / 2;
      boardTop = h * 0.20;
      draw();
    }

    function emptyGrid() {
      const g = [];
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) row.push({ mine: false, open: false, flag: false, count: 0 });
        g.push(row);
      }
      return g;
    }

    function placeMines(avoidR, avoidC) {
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS), c = Math.floor(Math.random() * COLS);
        if (Math.abs(r - avoidR) <= 1 && Math.abs(c - avoidC) <= 1) continue;
        if (grid[r][c].mine) continue;
        grid[r][c].mine = true;
        placed++;
      }
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (grid[r][c].mine) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const rr = r + dr, cc = c + dc;
          if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && grid[rr][cc].mine) count++;
        }
        grid[r][c].count = count;
      }
    }

    function reset() {
      grid = emptyGrid();
      score = 0; ended = false; won = false; firstClick = true; flagMode = false;
      scoreEl.textContent = score;
    }

    function start() {
      hud.style.display = 'flex';
      started = true;
      raf = requestAnimationFrame(loop);
    }

    function control(name) {
      if (ended) { reset(); return; }
      if (!started) start();
      if (name === 'BOOST') flagMode = !flagMode;
    }

    function cellAt(x, y) {
      const c = Math.floor((x - boardLeft) / cellSize);
      const r = Math.floor((y - boardTop) / cellSize);
      if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
      return { r, c };
    }

    function floodOpen(r, c) {
      const stack = [[r, c]];
      while (stack.length) {
        const [rr, cc] = stack.pop();
        const cell = grid[rr][cc];
        if (cell.open || cell.flag) continue;
        cell.open = true;
        if (cell.count === 0 && !cell.mine) {
          for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            const nr = rr + dr, nc = cc + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !grid[nr][nc].open) stack.push([nr, nc]);
          }
        }
      }
    }

    function checkWin() {
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (!grid[r][c].mine && !grid[r][c].open) return false;
      }
      return true;
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      const cell = cellAt(x, y);
      if (!cell) return;
      const { r, c } = cell;
      if (firstClick) { placeMines(r, c); firstClick = false; }
      const g = grid[r][c];
      if (flagMode) {
        if (!g.open) g.flag = !g.flag;
        return;
      }
      if (g.flag || g.open) return;
      if (g.mine) { g.open = true; ended = true; won = false; return; }
      floodOpen(r, c);
      score += 10;
      scoreEl.textContent = score;
      if (checkWin()) { ended = true; won = true; score += 100; scoreEl.textContent = score; }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = grid[r][c];
          const x = boardLeft + c * cellSize, y = boardTop + r * cellSize;
          ctx.fillStyle = cell.open ? OPEN_COLOR : CLOSED_COLOR;
          ctx.beginPath();
          ctx.roundRect(x + 1.5 * dpr, y + 1.5 * dpr, cellSize - 3 * dpr, cellSize - 3 * dpr, 4 * dpr);
          ctx.fill();
          if (cell.open && cell.mine) {
            ctx.fillStyle = MINE_COLOR;
            ctx.beginPath();
            ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize * 0.26, 0, Math.PI * 2);
            ctx.fill();
          } else if (cell.open && cell.count > 0) {
            ctx.fillStyle = NUM_COLORS[cell.count - 1] || '#FFFFFF';
            ctx.font = '900 ' + Math.floor(cellSize * 0.5) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(cell.count), x + cellSize / 2, y + cellSize / 2 + 1 * dpr);
          } else if (!cell.open && cell.flag) {
            ctx.fillStyle = FLAG_COLOR;
            ctx.beginPath();
            ctx.moveTo(x + cellSize * 0.35, y + cellSize * 0.25);
            ctx.lineTo(x + cellSize * 0.35, y + cellSize * 0.75);
            ctx.lineTo(x + cellSize * 0.68, y + cellSize * 0.4);
            ctx.closePath();
            ctx.fill();
          }
        }
      }
      ctx.textBaseline = 'alphabetic';

      ctx.fillStyle = flagMode ? FLAG_COLOR : 'rgba(0,0,0,.55)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 130 * dpr, h * 0.10, 260 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = flagMode ? '#000' : 'rgba(255,255,255,.85)';
      ctx.font = '900 ' + (11 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(flagMode ? 'FLAG MODE ON (BOOST TO TOGGLE)' : 'TAP TO REVEAL - BOOST TO FLAG', w * 0.5, h * 0.10 + 20 * dpr);

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = won ? '#00C48C' : MINE_COLOR;
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText(won ? 'YOU WIN!' : 'BOOM!', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to restart', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() { draw(); raf = requestAnimationFrame(loop); }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('contextmenu', (e) => e.preventDefault());
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
