<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bubble Pop</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071426; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #071426; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#071426';
    const COLORS = ['#5B8DEF', '#00C48C', '#FFC93C', '#FF7043', '#B85CFF', '#FF3D57'];

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true;
    let bubbles = [], score = 0, timeLeft = 40, spawnTimer = 0, misses = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      draw();
    }

    function reset() {
      bubbles = []; score = 0; timeLeft = 40; spawnTimer = 0; misses = 0; ended = false;
      scoreEl.textContent = score;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) { if (ended) { reset(); return; } if (!started) start(); }

    function spawnBubble() {
      const r = (14 + Math.random() * 20) * dpr;
      bubbles.push({
        x: r + Math.random() * (w - 2 * r),
        y: h + r,
        r,
        speed: (1.2 + Math.random() * 1.8) * dpr,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        isBad: Math.random() < 0.15,
      });
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (Math.hypot(x - b.x, y - b.y) <= b.r) {
          if (b.isBad) score = Math.max(0, score - 15);
          else score += 10;
          scoreEl.textContent = score;
          bubbles.splice(i, 1);
          return;
        }
      }
    }

    function step(dt) {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; ended = true; return; }
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnTimer = 0.35 + Math.random() * 0.35; spawnBubble(); }
      for (let i = bubbles.length - 1; i >= 0; i--) {
        bubbles[i].y -= bubbles[i].speed;
        if (bubbles[i].y < -bubbles[i].r) bubbles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      bubbles.forEach((b) => {
        ctx.fillStyle = b.isBad ? '#22252B' : b.color;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (b.isBad) {
          ctx.strokeStyle = '#FF3D57';
          ctx.lineWidth = 3 * dpr;
          ctx.beginPath();
          ctx.moveTo(b.x - b.r * 0.4, b.y - b.r * 0.4);
          ctx.lineTo(b.x + b.r * 0.4, b.y + b.r * 0.4);
          ctx.moveTo(b.x + b.r * 0.4, b.y - b.r * 0.4);
          ctx.lineTo(b.x - b.r * 0.4, b.y + b.r * 0.4);
          ctx.stroke();
        }
      });

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 100 * dpr, h * 0.06, 200 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (14 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('TIME: ' + Math.ceil(timeLeft) + 's', w * 0.5, h * 0.06 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (24 * dpr) + 'px Arial';
        ctx.fillText('POP BUBBLES, AVOID X', w / 2, h * 0.42);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = COLORS[0];
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText("TIME'S UP!", w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to play again', w / 2, h * 0.56);
      }
    }

    let raf = 0, lastT = 0;
    function loop(t) {
      const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
      lastT = t;
      if (started && !ended) step(dt);
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
