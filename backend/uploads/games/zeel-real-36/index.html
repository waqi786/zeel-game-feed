<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sudoku Lite</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101418; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #101418; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#101418';
    const GRID_COLOR = 'rgba(255,255,255,.18)';
    const BOLD_COLOR = 'rgba(255,255,255,.5)';
    const FIXED_COLOR = '#FFFFFF';
    const USER_COLOR = '#5B8DEF';
    const WRONG_COLOR = '#FF3D57';
    const SEL_COLOR = 'rgba(91,141,239,.28)';

    let dpr = 1, w = 0, h = 0, cell = 0, boardLeft = 0, boardTop = 0;
    let puzzle = [], solution = [], fixed = [], selected = -1, mistakes = 0, score = 0;
    let started = false, ended = false, muted = true, won = false;

    // A valid 4x4 sudoku-style (2x2 boxes), easier than full 9x9 for mobile
    const BASE_SOLUTION = [
      1,2,3,4,
      3,4,1,2,
      2,1,4,3,
      4,3,2,1
    ];

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      cell = Math.floor(Math.min(w - 60 * dpr, h * 0.5));
      cell = Math.floor(cell / 4);
      boardLeft = (w - cell * 4) / 2;
      boardTop = h * 0.26;
      draw();
    }

    function genPuzzle() {
      solution = BASE_SOLUTION.slice();
      // random transform: shuffle rows within band isn't needed for 4x4 simplicity; just permute digits
      const perm = [1,2,3,4].sort(() => Math.random() - 0.5);
      solution = solution.map((v) => perm[v - 1]);
      puzzle = solution.slice();
      fixed = Array(16).fill(true);
      const holes = 7 + Math.floor(Math.random() * 3);
      let removed = 0;
      const idxs = [...Array(16).keys()].sort(() => Math.random() - 0.5);
      for (const i of idxs) {
        if (removed >= holes) break;
        puzzle[i] = 0;
        fixed[i] = false;
        removed++;
      }
    }

    function reset() {
      genPuzzle();
      selected = -1; mistakes = 0; score = 0; ended = false; won = false;
      scoreEl.textContent = score;
    }

    function start() { hud.style.display = 'flex'; started = true; raf = requestAnimationFrame(loop); }
    function control(name) { if (ended) { reset(); return; } if (!started) start(); }

    function cellAt(x, y) {
      const c = Math.floor((x - boardLeft) / cell);
      const r = Math.floor((y - boardTop) / cell);
      if (c < 0 || c >= 4 || r < 0 || r >= 4) return -1;
      return r * 4 + c;
    }

    function pointerDown(x, y) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      const idx = cellAt(x, y);
      if (idx < 0) return;
      if (fixed[idx]) { selected = -1; return; }
      if (selected === idx) {
        // cycle input via tap: place next number 1-4
        const cur = puzzle[idx];
        const next = cur >= 4 ? 0 : cur + 1;
        placeNumber(idx, next);
      } else {
        selected = idx;
      }
    }

    function placeNumber(idx, val) {
      puzzle[idx] = val;
      if (val !== 0 && val !== solution[idx]) {
        mistakes++;
        score = Math.max(0, score - 5);
      } else if (val === solution[idx]) {
        score += 10;
      }
      scoreEl.textContent = score;
      if (mistakes >= 3) { ended = true; won = false; return; }
      if (puzzle.every((v, i) => v === solution[i])) {
        ended = true; won = true; score += 50; scoreEl.textContent = score;
      }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const idx = r * 4 + c;
          const x = boardLeft + c * cell, y = boardTop + r * cell;
          if (selected === idx) {
            ctx.fillStyle = SEL_COLOR;
            ctx.fillRect(x, y, cell, cell);
          }
        }
      }

      ctx.strokeStyle = GRID_COLOR;
      ctx.lineWidth = 2 * dpr;
      for (let i = 0; i <= 4; i++) {
        ctx.beginPath(); ctx.moveTo(boardLeft + i * cell, boardTop); ctx.lineTo(boardLeft + i * cell, boardTop + cell * 4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(boardLeft, boardTop + i * cell); ctx.lineTo(boardLeft + cell * 4, boardTop + i * cell); ctx.stroke();
      }
      ctx.strokeStyle = BOLD_COLOR;
      ctx.lineWidth = 4 * dpr;
      ctx.beginPath(); ctx.moveTo(boardLeft + 2 * cell, boardTop); ctx.lineTo(boardLeft + 2 * cell, boardTop + cell * 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(boardLeft, boardTop + 2 * cell); ctx.lineTo(boardLeft + cell * 4, boardTop + 2 * cell); ctx.stroke();

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const idx = r * 4 + c;
          const val = puzzle[idx];
          if (!val) continue;
          const x = boardLeft + c * cell + cell / 2, y = boardTop + r * cell + cell / 2;
          ctx.fillStyle = fixed[idx] ? FIXED_COLOR : (val === solution[idx] ? USER_COLOR : WRONG_COLOR);
          ctx.font = '900 ' + Math.floor(cell * 0.5) + 'px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(val), x, y + 2 * dpr);
        }
      }
      ctx.textBaseline = 'alphabetic';

      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 130 * dpr, h * 0.12, 260 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 ' + (11 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('TAP CELL, TAP AGAIN TO CYCLE - MISTAKES: ' + mistakes + '/3', w * 0.5, h * 0.12 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (24 * dpr) + 'px Arial';
        ctx.fillText('FILL 1-4, NO REPEATS', w / 2, h * 0.45);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = won ? USER_COLOR : WRONG_COLOR;
        ctx.font = '900 ' + (30 * dpr) + 'px Arial';
        ctx.fillText(won ? 'SOLVED!' : 'TOO MANY MISTAKES', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap for new puzzle', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() { draw(); raf = requestAnimationFrame(loop); }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', (e) => pointerDown(e.clientX * dpr, e.clientY * dpr));
    addEventListener('touchstart', (e) => { const t = e.touches[0]; if (t) pointerDown(t.clientX * dpr, t.clientY * dpr); }, { passive: true });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown(Number(data.x) * dpr, Number(data.y) * dpr);
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
