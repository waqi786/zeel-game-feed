<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tower Stack</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0D1421; font-family: Arial, sans-serif; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #0D1421; }
    .hud { position: fixed; left: 16px; top: max(116px, calc(env(safe-area-inset-top) + 96px)); z-index: 4; display: none; pointer-events: none; color: #fff; }
    .pill { min-width: 82px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(0,0,0,.6); padding: 9px 12px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud" id="hud"><div class="pill">Score <span id="score">0</span></div></div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score');

    const BG = '#0D1421';
    const COLORS = ['#FF3D57', '#FFC93C', '#00C48C', '#5B8DEF', '#B85CFF', '#00E5FF'];

    let dpr = 1, w = 0, h = 0;
    let started = false, ended = false, muted = true;
    let stack = [], current = null, score = 0, camY = 0, colorIdx = 0;
    const BLOCK_H = 46;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const rw = innerWidth || 390, rh = innerHeight || 844;
      w = Math.max(320, Math.floor(rw * dpr));
      h = Math.max(560, Math.floor(rh * dpr));
      canvas.width = w; canvas.height = h;
      draw();
    }

    function reset() {
      const baseW = w * 0.62;
      stack = [{ x: w / 2 - baseW / 2, w: baseW, y: h - 160 * dpr, color: COLORS[0] }];
      colorIdx = 1;
      score = 0; ended = false; camY = 0;
      scoreEl.textContent = score;
      spawnNext();
    }

    function spawnNext() {
      const last = stack[stack.length - 1];
      const dir = Math.random() < 0.5 ? -1 : 1;
      current = {
        x: dir === 1 ? -last.w : w,
        w: last.w,
        y: last.y - BLOCK_H * dpr,
        vx: (5 + Math.min(6, score * 0.15)) * dpr * dir,
        color: COLORS[colorIdx % COLORS.length]
      };
      colorIdx++;
    }

    function start() {
      hud.style.display = 'flex';
      started = true;
      raf = requestAnimationFrame(loop);
    }

    function drop() {
      if (!current || ended) return;
      const last = stack[stack.length - 1];
      const left = Math.max(current.x, last.x);
      const right = Math.min(current.x + current.w, last.x + last.w);
      const overlap = right - left;
      if (overlap <= 4 * dpr) {
        ended = true;
        return;
      }
      const newBlock = { x: left, w: overlap, y: current.y, color: current.color };
      stack.push(newBlock);
      score++;
      scoreEl.textContent = score;
      camY += BLOCK_H * dpr;
      spawnNext();
    }

    function control(name) {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      if (name === 'JUMP' || name === 'BOOST' || name === 'LEFT' || name === 'RIGHT') drop();
    }

    function pointerDown() {
      if (ended) { reset(); return; }
      if (!started) { start(); return; }
      drop();
    }

    function step() {
      if (current) {
        current.x += current.vx;
        if (current.x < -current.w * 0.2) current.vx *= -1;
        if (current.x + current.w > w + current.w * 0.2) current.vx *= -1;
      }
    }

    function draw() {
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(0, camY);
      stack.forEach((b) => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, BLOCK_H * dpr - 4 * dpr, 6 * dpr);
        ctx.fill();
      });
      if (current) {
        ctx.fillStyle = current.color;
        ctx.beginPath();
        ctx.roundRect(current.x, current.y, current.w, BLOCK_H * dpr - 4 * dpr, 6 * dpr);
        ctx.fill();
      }
      ctx.restore();

      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - 110 * dpr, h * 0.85, 220 * dpr, 30 * dpr, 999 * dpr);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.font = '900 ' + (11 * dpr) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('TAP TO DROP BLOCK', w * 0.5, h * 0.85 + 20 * dpr);

      if (!started) {
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 ' + (26 * dpr) + 'px Arial';
        ctx.fillText('TAP TO START', w / 2, h * 0.30);
      }

      if (ended) {
        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = COLORS[0];
        ctx.font = '900 ' + (32 * dpr) + 'px Arial';
        ctx.fillText('GAME OVER', w / 2, h * 0.44);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 ' + (16 * dpr) + 'px Arial';
        ctx.fillText('Score: ' + score, w / 2, h * 0.50);
        ctx.font = '700 ' + (13 * dpr) + 'px Arial';
        ctx.fillText('Tap to restart', w / 2, h * 0.56);
      }
    }

    let raf = 0;
    function loop() {
      if (started && !ended) step();
      draw();
      raf = requestAnimationFrame(loop);
    }
    function setMuted(v) { muted = Boolean(v); }

    addEventListener('resize', resize);
    addEventListener('pointerdown', pointerDown);
    addEventListener('touchstart', (e) => { pointerDown(); }, { passive: true });
    addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); pointerDown(); }
    });
    addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'START_GAME') { if (!started) start(); }
      if (data.type === 'globalMute') setMuted(data.value);
      if (data.type === 'ZEEL_POINTER' && data.kind === 'pointerdown') pointerDown();
      if (data.type === 'ZEEL_CONTROL') control(data.control);
    });

    resize();
    reset();
    hud.style.display = 'flex';
  </script>
</body>
</html>
